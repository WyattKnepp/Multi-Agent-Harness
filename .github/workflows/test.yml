name: test
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: cd server && npm ci
      - run: node --test tests/
      - run: cd server && node --test tests/
      - run: cd runner && node --test tests/
